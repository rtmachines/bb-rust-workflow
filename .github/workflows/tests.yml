name: tests
on: [push, pull_request]
jobs:
  unit-and-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - run: rustup component add rustfmt clippy
      - name: Require Cargo gate tools before tests
        shell: python
        run: |
          import shutil
          import subprocess
          required = ("git", "cargo", "rustc", "rustdoc", "rustfmt", "cargo-clippy")
          missing = [tool for tool in required if shutil.which(tool) is None]
          if missing:
              raise SystemExit("Missing required gate tools: " + ", ".join(missing))
          for command in (["cargo", "fmt", "--version"], ["cargo", "clippy", "--version"]):
              subprocess.run(command, check=True)
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py
