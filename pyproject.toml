[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-rust-workflow"
version = "0.1.0"
description = "Bounded Claude Code and Codex workflows for Rust projects"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
bb-workflow = "bb_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bb_workflow = ["default.toml", "prompts/*.md", "skills/*/SKILL.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
